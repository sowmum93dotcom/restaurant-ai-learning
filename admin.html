<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DEMEOS Admin Control</title><link rel="stylesheet" href="css/admin-business-review.css"></head>
<body class="admin-review-body"><header><a href="index.html" aria-label="DEMEOS home"><img src="images/demeos-logo.png" alt="DEMEOS"></a><div><p>DEMEOS Admin Control</p><h1 data-admin-copy="title">Business applications</h1></div><button id="admin-sign-out" hidden data-admin-copy="signOut">Sign out</button></header>
<main id="admin-application-review"><label for="admin-language" data-admin-copy="language">Language</label><select id="admin-language"></select><p data-admin-copy="intro">Review private submissions. Review does not grant business approval, selling or publication.</p><p id="admin-status" role="status" aria-live="polite"></p><button id="admin-sign-in" hidden data-admin-copy="signIn">Sign in</button>
<section id="admin-private" hidden><div class="admin-toolbar"><h2 data-admin-copy="applications">Submitted applications</h2><button id="admin-reload" data-admin-copy="reload">Reload</button></div><div id="admin-applications"></div><button id="admin-next" hidden data-admin-copy="next">Next page</button>
<section id="admin-detail" hidden tabindex="-1"><h2 id="admin-business-name"></h2><dl id="admin-facts"></dl><p id="admin-completeness"></p><h3 data-admin-copy="audit">Review history</h3><div id="admin-audit"></div><form id="admin-decision-form"><label for="admin-decision" data-admin-copy="decision">Review decision</label><select id="admin-decision"><option value="reviewed" data-admin-copy="reviewed">Review completed</option><option value="changes-requested" data-admin-copy="changes">Changes requested</option></select><label for="admin-notes" data-admin-copy="notes">Private review notes</label><textarea id="admin-notes" maxlength="2000" rows="4"></textarea><label class="admin-confirm"><input type="checkbox" id="admin-confirm"><span data-admin-copy="confirm">I reviewed this saved application. This decision grants no activation permissions.</span></label><button type="submit" id="admin-record" data-admin-copy="record">Record review</button></form></section></section></main>
<script src="js/demeos-language-registry.js"></script><script src="js/demeos-item-presentation-copy.js"></script><script src="js/business-workspace.js"></script><script src="js/admin-business-review.js"></script></body></html>
