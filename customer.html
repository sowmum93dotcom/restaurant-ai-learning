<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discover with DEMEOS</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hero customer-hero">
    <div class="demeos-brand"><img src="images/demeos-logo.png" alt="DEMEOS logo" class="demeos-logo" /></div>
    <p class="agent-label">DEMEOS</p>
    <h1 class="restaurant-name">Discover local businesses</h1>
    <p class="cuisine-type">Approved work from businesses using DEMEOS</p>
  </header>
  <main class="customer-main">
    <section class="customer-experience" aria-labelledby="customer-work-heading">
      <h2 id="customer-work-heading">From DEMEOS businesses</h2>
      <p id="customer-work-status" aria-live="polite">Loading approved work…</p>
      <div id="customer-work-list" class="customer-work-list"></div>
    </section>
  </main>
  <footer><p>&copy; 2026 DEMEOS — One System. Real Value. Shared Future.</p></footer>
  <script src="js/customer.js"></script>
</body>
</html>
