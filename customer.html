<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tell DEMEOS what you need, then explore approved customer-facing work." />
  <title>Customer Interface | DEMEOS</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/customer-possibilities-responsive.css" />
</head>
<body class="customer-body">
  <header class="customer-header">
    <div class="customer-header-inner">
      <a class="customer-brand" href="#customer-title" aria-label="DEMEOS Customer Interface home">
        <img src="images/demeos-logo.png" alt="DEMEOS" class="demeos-logo" />
      </a>
    </div>
  </header>

  <main class="customer-main">
    <section class="customer-intention" aria-labelledby="customer-title">
      <div class="customer-intention-glow" aria-hidden="true"></div>
      <div class="customer-intention-inner">
        <p class="customer-eyebrow">DEMEOS Customer Interface</p>
        <p class="customer-stage-label" data-stage-copy="stageLabel"></p>
        <p id="customer-greeting" class="customer-greeting"></p>
        <h1 id="customer-title" data-stage-copy="question"></h1>
        <p class="customer-trust-copy" data-stage-copy="trust"></p>

        <form id="customer-intention-form" class="customer-intention-form">
          <fieldset>
            <legend class="visually-hidden" data-stage-copy="intentionLegend"></legend>
            <div id="customer-intention-options" class="customer-intention-options"></div>
          </fieldset>

          <div class="customer-intention-detail">
            <label for="customer-intention-text" data-stage-copy="textLabel"></label>
            <textarea id="customer-intention-text" name="customer-intention" rows="3" data-stage-placeholder="textPlaceholder"></textarea>
          </div>

          <div class="customer-context-actions">
            <div>
              <button id="customer-location-button" class="customer-location-button" type="button" data-stage-copy="locationAction"></button>
              <p id="customer-location-status" class="customer-context-status" aria-live="polite"></p>
            </div>
            <button class="customer-continue-button" type="submit" data-stage-copy="continueAction"></button>
          </div>
          <p id="customer-intention-status" class="customer-context-status customer-intention-status" aria-live="polite"></p>
        </form>

        <section id="customer-understanding" class="customer-understanding" aria-labelledby="customer-understanding-heading" hidden>
          <p class="customer-stage-label" data-understanding-copy="stageLabel"></p>
          <h2 id="customer-understanding-heading" tabindex="-1" data-understanding-copy="heading"></h2>
          <p id="customer-understanding-summary" class="customer-understanding-summary"></p>
          <div id="customer-clarification" class="customer-clarification" hidden>
            <label for="customer-clarification-text" data-understanding-copy="clarificationLabel"></label>
            <input id="customer-clarification-text" type="text" autocomplete="off" />
            <button id="customer-clarification-button" type="button" data-understanding-copy="clarificationAction"></button>
          </div>
          <p class="customer-understanding-trust" data-understanding-copy="foundationTrust"></p>
          <div id="customer-understanding-actions" class="customer-understanding-actions">
            <button id="customer-understanding-confirm" type="button" data-understanding-copy="confirmAction"></button>
            <button id="customer-understanding-change" type="button" data-understanding-copy="changeAction"></button>
          </div>
          <p id="customer-understanding-status" class="customer-understanding-status" aria-live="polite"></p>
        </section>

        <section id="customer-possibilities" class="customer-possibilities" aria-labelledby="customer-possibilities-heading" hidden>
          <header class="customer-possibilities-header">
            <p class="customer-stage-label" data-possibilities-copy="stageLabel"></p>
            <h2 id="customer-possibilities-heading" tabindex="-1"></h2>
            <p data-possibilities-copy="introduction"></p>
          </header>
          <div class="customer-possibility-space">
            <div class="customer-space-rings" aria-hidden="true"></div>
            <div id="customer-possibility-intention" class="customer-possibility-intention"></div>
            <div id="customer-possibilities-list" class="customer-possibilities-list"></div>
            <div id="customer-focused-possibility" class="customer-focused-possibility" role="region" aria-live="polite" tabindex="-1" hidden></div>
          </div>
          <button id="customer-change-intention" class="customer-change-intention" type="button" data-possibilities-copy="changeAction"></button>
        </section>
      </div>
    </section>

    <section id="discover" class="customer-experience customer-approved-work-fallback" aria-labelledby="customer-work-heading" hidden>
      <div class="customer-section-heading">
        <div><p class="customer-step">Approved customer work</p><h2 id="customer-work-heading">Approved work, ready to explore</h2></div>
        <p>Only public work a business has approved for customers appears here.</p>
      </div>
      <p id="customer-work-status" class="customer-work-status" aria-live="polite">Loading approved work…</p>
      <div id="customer-work-list" class="customer-work-list"></div>
    </section>
  </main>
  <footer class="customer-footer"><img src="images/demeos-logo.png" alt="" /><p>&copy; 2026 DEMEOS — One System. Real Value. Shared Future.</p></footer>
  <script src="js/customer-understanding.js"></script>
  <script src="js/customer.js"></script>
</body>
</html>
