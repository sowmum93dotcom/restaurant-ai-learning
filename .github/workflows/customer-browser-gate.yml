name: Customer Experience Browser Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser:
    env:
      DEMEOS_BROWSER_CHANNEL: chrome
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependency
        run: npm install --no-save playwright@1.55.0
      - name: Install browser
        run: npx playwright install --with-deps chromium chrome
      - name: Start static Customer Experience
        run: |
          npx --yes http-server . -p 4173 -c-1 > /tmp/demeos-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/customer.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/demeos-http.log
          exit 1
      - name: Fetch exact owner design comparison baseline
        run: git fetch --no-tags --depth=1 origin 8c4ccbc93af01480f41e6444446b79a321a11ef9
      - name: Run owner workspace SQL, permission and draft gate
        run: node browser-checks/business-workspace-gate.js
      - name: Run selling vendor inventory SQL and rendered gate
        run: node browser-checks/vendor-inventory-gate.js
      - name: Run private administrative application review gate
        run: node browser-checks/admin-business-review-gate.js
      - name: Run approved source SQL and customer continuation gate
        run: node browser-checks/customer-approved-source-gate.js
      - name: Run public homepage and information gate
        run: node browser-checks/customer-public-entry-gate.js
      - name: Run Customer Experience context continuity gate
        run: node browser-checks/customer-context-gate.js
      - name: Run complete customer navigation and history gate
        run: node browser-checks/customer-navigation-gate.js
      - name: Run browser language gate
        run: node browser-checks/customer-language-gate.js
      - name: Run customer account completion gate
        run: node browser-checks/customer-account-completion-gate.js
      - name: Run controlled supplied media and continuation gate
        run: node browser-checks/customer-controlled-media-gate.js
      - name: Run customer request search gate
        run: node browser-checks/customer-search-gate.js
      - name: Run real HTTP intelligence integration gate
        run: node browser-checks/customer-intelligence-integration-gate.js
      - name: Run customer registration and preparation gate
        run: node browser-checks/customer-preparation-gate.js
      - name: Run private customer payment status gate
        run: node browser-checks/customer-payment-gate.js
      - name: Preserve rendered Customer Experience review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-experience-review
          path: |
            /tmp/demeos-home-*.png
            /tmp/demeos-public-*.png
            /tmp/customer-quality-*.png
            /tmp/issue669-*.png
            /tmp/demeos-controlled-*.png
            /tmp/demeos-genuine-search-*.png
            /tmp/demeos-context-*.png
            /tmp/demeos-contact-*.png
            /tmp/demeos-account-*.png
            /tmp/demeos-owner-*.png
            /tmp/demeos-owner-layout-*.json
            /tmp/demeos-admin-*.png
