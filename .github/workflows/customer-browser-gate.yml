name: Customer Experience Browser Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Start static Customer Experience
        run: |
          npx --yes http-server . -p 4173 -c-1 > /tmp/demeos-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/customer.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/demeos-http.log
          exit 1
      - name: Run browser language gate
        run: npx --yes -p playwright@1.55.0 node test/browser/customer-language-gate.js
